name: Comprimir Imágenes Automáticamente

on:
  push:
    branches:
      - main # O el nombre de tu rama principal (master)
    paths:
      - 'assets/**' # Cambia esto por la ruta exacta donde guardas tus imágenes (ej. img/** o images/**)

jobs:
  compress:
    name: Comprimir y Optimizar Imágenes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Comprimir imágenes
        uses: CalebBarnes/compress-images-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          jpeg_quality: '80'
          png_quality: '80'
