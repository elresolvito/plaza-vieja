name: Comprimir Imágenes Automáticamente

on:
  push:
    branches:
      - main 
    paths:
      - 'productos/**' 

jobs:
  compress:
    name: Comprimir y Optimizar Imágenes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Comprimir imágenes
        uses: CalebBarnes/compress-images-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          jpeg_quality: '80'
          png_quality: '80'
